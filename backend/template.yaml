AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Far Too Young Authentication API
# Updated: 2024-12-19 - Fixed secret key case consistency

Parameters:
  Environment:
    Type: String
    Default: development
    AllowedValues: [development, staging, production]
    Description: Deployment environment
  
  DynamoDBEndpoint:
    Type: String
    Default: http://host.docker.internal:8000
    Description: Endpoint for local DynamoDB endpoint (leave empty for production)
  
  SecretsManagerArn:
    Type: String
    Default: ""
    Description: ARN of the Secrets Manager secret containing application secrets
    NoEcho: true

Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  IsStaging: !Equals [!Ref Environment, staging]

Globals:
  Function:
    Runtime: nodejs18.x
    Environment:
      Variables:
        DYNAMODB_ENDPOINT: !Ref DynamoDBEndpoint
        SECRETS_MANAGER_ARN: !Ref SecretsManagerArn
        USERS_TABLE: !Sub "${AWS::StackName}-users-table"
        DONATIONS_TABLE: !Sub "${AWS::StackName}-donations-table"
        BLOG_TABLE: !Sub "${AWS::StackName}-blog-posts"
        SES_FROM_EMAIL: admin@fartooyoung.org
        SES_REGION: !Ref AWS::Region
        FRONTEND_URL: !If 
          - IsProduction
          - "https://www.fartooyoung.org"
          - !If
            - IsStaging
            - "https://staging.fartooyoung.org"
            - "http://localhost:5173"
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'*'"

Resources:
  # Authentication Functions
  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda/auth/login.handler
      Environment:
        Variables:
          RATE_LIMIT_TABLE: !Sub "${AWS::StackName}-rate-limits"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "${AWS::StackName}-users-table"
        - DynamoDBCrudPolicy:
            TableName: !Sub "${AWS::StackName}-rate-limits"
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref SecretsManagerArn
      Events:
        LoginApi:
          Type: Api
          Properties:
            Path: /auth/login
            Method: post

  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda/auth/register.handler
      Environment:
        Variables:
          RATE_LIMIT_TABLE: !Sub "${AWS::StackName}-rate-limits"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "${AWS::StackName}-users-table"
        - DynamoDBCrudPolicy:
            TableName: !Sub "${AWS::StackName}-rate-limits"
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref SecretsManagerArn
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        RegisterApi:
          Type: Api
          Properties:
            Path: /auth/register
            Method: post

  LogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda/auth/logout.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "${AWS::StackName}-users-table"
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref SecretsManagerArn
      Events:
        LogoutApi:
          Type: Api
          Properties:
            Path: /auth/logout
            Method: post

  ForgotPasswordFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda/auth/forgot-password.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "${AWS::StackName}-users-table"
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        ForgotPasswordApi:
          Type: Api
          Properties:
            Path: /auth/forgot-password
            Method: post

  ResetPasswordFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda/auth/reset-password.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "${AWS::StackName}-users-table"
      Events:
        ResetPasswordApi:
          Type: Api
          Properties:
            Path: /auth/reset-password
            Method: post

  UpdateProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda/auth/update-profile.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "${AWS::StackName}-users-table"
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref SecretsManagerArn
      Events:
        UpdateProfileApi:
          Type: Api
          Properties:
            Path: /auth/update-profile
            Method: post

  ChangePasswordFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda/auth/change-password.handler
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "${AWS::StackName}-users-table"
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref SecretsManagerArn
      Events:
        ChangePasswordApi:
          Type: Api
          Properties:
            Path: /auth/change-password
            Method: post

  VerifyEmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda/auth/verify-email.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "${AWS::StackName}-users-table"
      Events:
        VerifyEmailApi:
          Type: Api
          Properties:
            Path: /auth/verify-email
            Method: get

  ResendVerificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda/auth/resend-verification.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "${AWS::StackName}-users-table"
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        ResendVerificationApi:
          Type: Api
          Properties:
            Path: /auth/resend-verification
            Method: post

  # Donation Functions
  CreateDonationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda/donations/create-donation.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "${AWS::StackName}-donations-table"
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref SecretsManagerArn
      Events:
        CreateDonationApi:
          Type: Api
          Properties:
            Path: /donations
            Method: post

  GetDonationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda/donations/get-donations.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "${AWS::StackName}-donations-table"
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref SecretsManagerArn
      Events:
        GetDonationsApi:
          Type: Api
          Properties:
            Path: /donations
            Method: get

  # Stripe Payment Functions
  CreateCheckoutSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda/stripe/create-checkout-session.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "${AWS::StackName}-donations-table"
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref SecretsManagerArn
      Events:
        CreateCheckoutSessionApi:
          Type: Api
          Properties:
            Path: /stripe/create-checkout-session
            Method: post

  CreatePaymentIntentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda/stripe/create-payment-intent.handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref SecretsManagerArn
      Events:
        CreatePaymentIntentApi:
          Type: Api
          Properties:
            Path: /stripe/create-payment-intent
            Method: post

  CreatePortalSessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda/stripe/create-portal-session.handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref SecretsManagerArn
      Events:
        CreatePortalSessionApi:
          Type: Api
          Properties:
            Path: /stripe/create-portal-session
            Method: post

  ListSubscriptionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda/stripe/list-subscriptions.handler
      Timeout: 30
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref SecretsManagerArn
      Events:
        ListSubscriptionsApi:
          Type: Api
          Properties:
            Path: /stripe/list-subscriptions
            Method: get

  StripeWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda/stripe/webhook.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "${AWS::StackName}-donations-table"
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref SecretsManagerArn
      Events:
        StripeWebhookApi:
          Type: Api
          Properties:
            Path: /stripe/webhook
            Method: post

  # DynamoDB Tables
  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-users-table"
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  DonationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-donations-table"
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  RateLimitsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-rate-limits"
      AttributeDefinitions:
        - AttributeName: limitKey
          AttributeType: S
      KeySchema:
        - AttributeName: limitKey
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  BlogPostsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-blog-posts"
      AttributeDefinitions:
        - AttributeName: post_id
          AttributeType: S
        - AttributeName: slug
          AttributeType: S
      KeySchema:
        - AttributeName: post_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: slug-index
          KeySchema:
            - AttributeName: slug
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  ResearchArticlesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-research-articles"
      AttributeDefinitions:
        - AttributeName: article_id
          AttributeType: S
      KeySchema:
        - AttributeName: article_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # Research Fetcher
  ResearchFetcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/blog/research-fetcher.handler
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          RESEARCH_TABLE: !Sub "${AWS::StackName}-research-articles"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResearchArticlesTable
      Events:
        WeeklyTrigger:
          Type: Schedule
          Properties:
            Schedule: cron(0 10 ? * MON *)
            Description: Fetch research articles every Monday 10am UTC
        Api:
          Type: Api
          Properties:
            Path: /research/fetch
            Method: post

  # Get Research Articles (public)
  GetResearchArticlesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/blog/get-research-articles.handler
      Timeout: 10
      Environment:
        Variables:
          RESEARCH_TABLE: !Sub "${AWS::StackName}-research-articles"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ResearchArticlesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /research/articles
            Method: get

  # Blog API Functions
  GetBlogPostsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/blog/get-blog-posts.handler
      Timeout: 10
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BlogPostsTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /blog/posts
            Method: get

  GetBlogPostFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/blog/get-blog-post.handler
      Timeout: 10
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BlogPostsTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /blog/posts/slug/{slug}
            Method: get

  CreateBlogPostFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/blog/create-blog-post.handler
      Timeout: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlogPostsTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref SecretsManagerArn
      Events:
        Api:
          Type: Api
          Properties:
            Path: /blog/posts
            Method: post

  UpdateBlogPostFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/blog/update-blog-post.handler
      Timeout: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlogPostsTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref SecretsManagerArn
      Events:
        Api:
          Type: Api
          Properties:
            Path: /blog/posts/{id}
            Method: put

  PublishBlogPostFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/blog/publish-blog-post.handler
      Timeout: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlogPostsTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref SecretsManagerArn
      Events:
        Api:
          Type: Api
          Properties:
            Path: /blog/posts/{id}/publish
            Method: post

  DeleteBlogPostFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/blog/delete-blog-post.handler
      Timeout: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlogPostsTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref SecretsManagerArn
      Events:
        Api:
          Type: Api
          Properties:
            Path: /blog/posts/{id}
            Method: delete

  # Admin Research Management
  AdminResearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/blog/admin-research.handler
      Timeout: 15
      Environment:
        Variables:
          RESEARCH_TABLE: !Sub "${AWS::StackName}-research-articles"
          TIERS_TABLE: !Sub "${AWS::StackName}-tiers"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResearchArticlesTable
        - DynamoDBReadPolicy:
            TableName: !Sub "${AWS::StackName}-tiers"
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref SecretsManagerArn
      Events:
        GetAll:
          Type: Api
          Properties:
            Path: /admin/research
            Method: get
        GetTiers:
          Type: Api
          Properties:
            Path: /admin/tiers
            Method: get
        Create:
          Type: Api
          Properties:
            Path: /admin/research
            Method: post
        Update:
          Type: Api
          Properties:
            Path: /admin/research/{id}
            Method: put
        Delete:
          Type: Api
          Properties:
            Path: /admin/research/{id}
            Method: delete

  # Image Upload (presigned URL)
  UploadImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/blog/upload-image.handler
      Timeout: 10
      Environment:
        Variables:
          S3_BUCKET: !If
            - IsProduction
            - fartooyoung-prod-frontend
            - fartooyoung-stg-frontend
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !If
                - IsProduction
                - "arn:aws:s3:::fartooyoung-prod-frontend/blog/images/*"
                - "arn:aws:s3:::fartooyoung-stg-frontend/blog/images/*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref SecretsManagerArn
      Events:
        Api:
          Type: Api
          Properties:
            Path: /admin/upload-image
            Method: post

  # Blog Generator (AI Content)
  BlogGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda/blog/blog-generator.handler
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          RESEARCH_TABLE: !Sub "${AWS::StackName}-research-articles"
          BLOG_TABLE: !Sub "${AWS::StackName}-blog-posts"
          S3_BUCKET: !If
            - IsProduction
            - fartooyoung-prod-frontend
            - fartooyoung-stg-frontend
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ResearchArticlesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BlogPostsTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !If
                - IsProduction
                - "arn:aws:s3:::fartooyoung-prod-frontend/blog/images/*"
                - "arn:aws:s3:::fartooyoung-stg-frontend/blog/images/*"
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref SecretsManagerArn
      Events:
        Api:
          Type: Api
          Properties:
            Path: /admin/generate-post
            Method: post
        MondayTrigger:
          Type: Schedule
          Properties:
            Schedule: cron(0 11 ? * MON *)
            Description: Generate blog post every Monday 11am UTC
        FridayTrigger:
          Type: Schedule
          Properties:
            Schedule: cron(0 11 ? * FRI *)
            Description: Generate blog post every Friday 11am UTC

Outputs:
  ApiGatewayApi:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"

